name: Deploy Personal Dashboard

on:
  push:
    branches: [ personal ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build -- --mode personal
      - name: Authenticate gcloud / Firebase CLI
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PERSONAL }}' > "$HOME/firebase-key-personal.json"
      - name: Deploy Firestore rules
        continue-on-error: true
        run: npx firebase-tools@latest deploy --only firestore:rules --project mediactive-dashboard-backend
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/firebase-key-personal.json
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: deploy
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PERSONAL }}
          projectId: mediactive-dashboard-backend
          channelId: live
      - name: Print deploy URL
        run: echo "DEPLOY URL -> ${{ steps.deploy.outputs.details_url }}"
